<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alquimia BDO v1</title>
    <link rel="icon" href="icono1.svg" type="image/svg+xml">
    <script src="bdoalquimia.js"></script>
</head>
<link rel="stylesheet" href="alquimia.css?d=12">
<body>

    <div id="consola" aria-hidden="true">
        <div id="consola_salida"></div>
        <div id="consola_linea">
            <span id="consola_prompt">&gt;</span>
            <input type="text" id="consola_input" autocomplete="off" autocorrect="off"
                   autocapitalize="off" spellcheck="false" placeholder="5 * 10">
        </div>
        <div id="consola_pie">
            <span><b>|</b> cierra</span>
            <span><b>Esc</b> cierra</span>
            <span><b>↑ ↓</b> historial</span>
            <span><b>ans</b> último resultado</span>
            <span><b>help</b> ayuda</span>
        </div>
    </div>

    <div id="contenido">
        <h3>BDO - Alquimia  V 1.1</h3>
        <a href="index.html"><img src="icono1.svg" width="45px" height="45px" alt="" style="vertical-align: middle;"></a>
        <input type="search" id="buscador" placeholder="Ingrese receta" style="vertical-align: middle;">
        <div id="resultbox">
            <ul id="lista_recetas" style="display: block;">

            </ul>
        </div>
        <div class="seccion">
            <ul id="ingredientes">

            </ul>
            <ul id="otros">

            </ul>
            <h2>Lista de ingredientes: </h2>
            <div id="tabs_base">
                <button type="button" class="tab_btn activo" id="tab_arbol">Árbol de ingredientes</button>
                <button type="button" class="tab_btn" id="tab_puros">Ingredientes puros</button>
            </div>
            <input type="search" id="buscador_ingredientes" placeholder="Buscar ingrediente base..." style="display: none;">
            <ul id="ingredientes_base">
                <li>Sin calcular aún</li>
            </ul>
            <ul id="ingredientes_puros" class="oculto">
                <li>Sin calcular aún</li>
            </ul>
        </div>
        <span style="font-size: 11px;">Creado por: KlausD (WhiteDraco) - BDO SA | Con ayuda de Claude Opus 5</span>

    </div>
</body>
</html>
